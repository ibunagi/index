<style>
:root{--bg:#f5f7fb;--card:#fff;--text:#111827;--muted:#667085;--accent:#2563eb;--good:#15803d;--bad:#dc2626;--border:#e5e7eb}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP","Hiragino Sans",sans-serif}
header{position:sticky;top:0;z-index:5;background:#111827;color:#fff;padding:14px 16px;display:flex;justify-content:space-between}
h1{font-size:18px;margin:0}button,select{font:inherit}button{border:0;border-radius:12px;padding:11px 14px;background:var(--accent);color:#fff;font-weight:700}
.wrap{max-width:760px;margin:auto;padding:16px 14px 80px}.card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:18px;margin:12px 0;box-shadow:0 3px 12px #00000008}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.stat{padding:14px;border-radius:14px;background:#f8fafc;border:1px solid var(--border)}.stat b{font-size:24px;display:block}
.menu{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:14px}.menu button{padding:16px;text-align:left}
.secondary{background:#e5e7eb;color:#111827}.danger{background:#fee2e2;color:#991b1b}.hidden{display:none!important}
.muted{color:var(--muted);font-size:13px}.qnum{font-size:13px;color:var(--muted);margin-bottom:8px}.question{font-size:19px;line-height:1.65;font-weight:700;white-space:pre-line;margin:8px 0 18px}
.choice{width:100%;background:#fff;color:#111827;border:1px solid var(--border);text-align:left;margin:7px 0;padding:14px;border-radius:13px;line-height:1.45}
.choice.correct{border-color:var(--good);background:#f0fdf4}.choice.wrong{border-color:var(--bad);background:#fef2f2}
.explain{margin-top:14px;padding:14px;border-radius:12px;background:#f8fafc;line-height:1.6}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row>*{flex:1;min-width:120px}
progress{width:100%;height:10px}.pill{display:inline-block;padding:5px 9px;border-radius:999px;background:#eef2ff;color:#3730a3;font-size:12px;margin-right:5px}
@media(max-width:520px){.grid,.menu{grid-template-columns:1fr}.question{font-size:18px}}
footer{text-align:center;color:var(--muted);font-size:12px;margin-top:30px}
</style></head>

:8,"cat":"マンション管理適正化法","type":"事例","q":"【事例】マンション管理の実務で「分別管理の目的」について確認することになった。最も適切な説明はどれか。","choices":["分別管理は、管理組合財産を管理業者の固有財産等と区別して管理し、財産の保全を図るための制度である。","法律や規約より管理会社の社内ルールが常に優先する。","理事長が単独で自由に決定できる。","区分所有者全員の個別同意が必ず必要である。"],"a":0,"ex":"実務では法令・規約・契約を確認する。今回のポイントは「分別管理は、管理組合財産を管理業者の固有財産等と区別して管理し、財産の保全を図るための制度である。」。","level":"A"},{"id":9,"cat":"区分所有法","type":"事例","q":"【事例】マンション管理の実務で「集会招集請求」について確認することになった。最も適切な説明はどれか。","choices":["区分所有者の5分の1以上で議決権の5分の1以上を有する者は、規約に別段の定めがなければ、管理者に集会の招集を請求できる。","法律や規約より管理会社の社内ルールが常に優先する。","理事長が単独で自由に決定できる。","区分所有者全員の個別同意が必ず必要である。"],"a":0,"ex":"実務では法令・規約・契約を確認する。今回のポイントは「区分所有者の5分の1以上で議決権の5分の1以上を有する者は、規約に別段の定めがなければ、管理者に集会の招集を請求できる。」。","level":"A"},{"id":10,"cat":"会計","type":"4択","q":"次の記述のうち、正しいものはどれか。【費用の仕訳】","choices":["費用が発生する取引は、原則として貸方に記録する。","費用が発生する取引は、原則として借方に記録する。","この論点は管理業務主任者試験の対象外である。","法律・規約にかかわらず理事長が単独で決定できる。"],"a":1,"ex":"正解は②。費用が発生する取引は、原則として借方に記録する。","level":"B"},{"id":11,"cat":"管理委託契約","type":"確認","q":"「契約書面」について、最も適切な説明はどれか。","choices":["管理委託契約では、委託する業務の範囲を明確にすることが重要である。","この制度は必ず反対の扱いになる。","管理組合には一切関係しない。","規約より常に管理会社の判断が優先する。"],"a":0,"ex":"ポイント：管理委託契約では、委託する業務の範囲を明確にすることが重要である。","level":"C"},{"id":12,"cat":"管理委託契約","type":"確認","q":"「善管注意義務」について、最も適切な説明はどれか。","choices":["管理会社は、委託された管理事務を善良な管理者の注意をもって処理する。","この制度は必ず反対の扱いになる。","管理組合には一切関係しない。","規約より常に管理会社の判断が優先する。"],"a":0,"ex":"ポイント：管理会社は、委託された管理事務を善良な管理者の注意をもって処理する。","level":"C"},{"id":13,"cat":"標準管理規約","type":"正誤","q":"次の記述は正しいか。\n「管理組合は、建物並びにその敷地及び附属施設の管理を行うことを目的とする。」","choices":["正しい","誤り","どちらともいえない","規定されていない"],"a":0,"ex":"【標準管理規約／管理組合の目的】管理組合は、建物並びにその敷地及び附属施設の管理を行うことを目的とする。","level":"A"},{"id":14,"cat":"管理委託契約","type":"4択","q":"次の記述のうち、【誤っているもの】はどれか。【個人情報】","choices":["管理会社は、組合員等の個人情報を適切に取り扱う必要がある。","管理会社の判断だけで常に変更できる。","区分所有者全員の個別同意が常に必要である。","この論点には法令・規約上のルールが存在しない。"],"a":1,"ex":"誤りは②。基準となる内容は「管理会社は、組合員等の個人情報を適切に取り扱う必要がある。」。","level":"B"},{"id":15,"cat":"マンション管理適正化法","type":"確認","q":"「監督処分」について、最も適切な説明はどれか。","choices":["国土交通大臣は、法令違反等に対してマンション管理業者に監督処分を行うことができ は一切関係しない。","規約より常に管理会社の判断が優先する。"],"a":0,"ex":"ポイント：収支計算書は、一定期間の収入と支出の状況を把握するために用いられる。","level":"C"},{"id":220,"cat":"区分所有法","type":"4択","q":"次の記述のうち、正しいものはどれか。【規約原本の閲覧】","choices":["利害関係人から規約の閲覧請求があった場合、正当な理由がある場合を除き、閲覧を拒むことができない。 ただし、管理会社が単独で自由に変更できる。","利害関係人から規約の閲覧請求があった場合、正当な理由がある場合を除き、閲覧を拒むことができない。","この論点は管理業務主任者試験の対象外である。","法律・規約にかかわらず理事長が単独で決定できる。"],"a":1,"ex":"正解は②。利害関係人から規約の閲覧請求があった場合、正当な理由がある場合を除き、閲覧を拒むことができない。","level":"A"},{"id":221,"cat":"区分所有法","type":"4択","q":"次の記述のうち、【誤っているもの】はどれか。【損害賠償請求権等の代理行使】","choices":["改正法では、共用部分等に係る損害賠償請求権等の代理行使に関する規律が整備された。","管理会社の判断だけで常に変更できる。","区分所有者全員の個別同意が常に必要である。","この論点には法令・規約上のルールが存在しない。"],"a":1,"ex":"誤りは②。基準となる内容は「改正法では、共用部分等に係る損害賠償請求権等の代理行使に関する規律が整備された。」。","level":"A"},{"id":222,"cat":"区分所有法","type":"正誤","q":"次の記述は正しいか。\n「規約は、管理者が保管する。ただし、管理者がないときは、規約又は集会の決議で定めた区分所有者が保管する。」","choices":["正しい","誤り","どちらともいえない","規定されていない"],"a":0,"ex":"【区分所有法／規約の保管】規約は、管理者が保管する。ただし、管理者がないときは、規約又は集会の決議で定めた区分所有者が保管する。","level":"A"},{"id":223,"cat":"会計","type":"正誤","q":"次の記述は正しいか。\n「管理費を現金で受け取った場合、現金は借方、管理費収入は貸方に記録する。」","choices":["正しい","誤り","どちらともいえない","規定されていない"],"a":0,"ex":"【会計／現金収入】管理費を現金で受け取った場合、現金は借方、管理費収入は貸方に記録する。","level":"B"},{"id":224,"cat":"マンション管理適正化法","type":"事例","q":"【事例】マンション管理の実務で「帳簿」について確認することになった。最も適切な説明はどれか。","choices":["マンション管理業者は、管理事務に関する帳簿を備え付ける義務を負う。","法律や規約より管理会社の社内ルールが常に優先する。","理事長が単独で自由に決定できる。","区分所有者全員の個別同意が必ず必要である。"],"a":0,"ex":"実務では法令・規約・契約を確認する。今回のポイントは「マンション管理業者は、管理事務に関する帳簿を備え付ける義務を負う。」。","level":"A"},{"id":225,"cat":"管理委託契約","type":"事例","q":"【事例】マンション管理の実務で「再委託」について確認することになった。最も適切な説明はどれか。","choices":["管理会社が一部業務を第三者に再委託する場合は、法令及び契約に従う。","法律や規約より管理会社の社内ルールが常に優先する。","理事長が単独で自由に決定できる。","区分所有者全員の個別同意が必ず必要である。"],"a":0,"ex":"実務では法令・規約・契約を確認する。今回のポイントは「管理会社が一部業務を第三者に再委託する場合は、法令及び契約に従う。」。","level":"B"},{"id":226,"cat":"標準管理規約","type":"正誤","q":"次の記述は正しいか。\n「副理事長は、理事長を補佐し、理事長に事故があるとき等には職務を代理・代行する。」","choices":["正しい","誤り","どちらともいえない","規定されていない"],"a":0,"ex":"【標準管理規約／副理事長】副理事長は、理事長を補佐し、理事長に事故があるとき等には職務を代理・代行する。","level":"A"},{"id":227,"cat":"標準管理規約","type":"4択","q":"次の記述のうち、正しいものはどれか。【理事会の議事録】","choices":["理事会の議事については、議事録を作成する。 ただし、管理会社が単独で自由に変更できる。","理事会の議事については、議事録を作成する。","この論点は管理業務主任者試験の対象外である。","法律・規約にかかわらず理事長が単独で決定できる。"],"a":1,"ex":"正解は②。理事会の議事については、議事録を作成する。","level":"A"},{"id":228,"cat":"区分所有法","type":"事例","q":"【事例】マンション管理の実務で「建替え決議」について確認することになった。最も適切な説明はどれか。","choices":["建物の建替えは、区分所有法所定の要件を満たす集会決議によって行うことができる。","法律や規約より管理会社の社内ルールが常に優先する。","理事長が単独で自由に決定できる。","区分所有者全員の個別同意が必ず必要である。"],"a":0,"ex":"実務では法令・規約・契約を確認する。今回のポイントは「建物の建替えは、区分所有法所定の要件を満たす集会決議によって行うことができる。」。","level":"A"},{"id":229,"cat":"標準管理規約","type":"事例","q":"【事例】マンション管理の実務で「副理事長」について確認することになった。最も適切な説明はどれか。","choices":["副理事長は、理事長を補佐し、理事長に事故があるとき等には職務を代理・代行する。","法律や規約より管理会社の社内ルールが常に優先する。","理事長が単独で自由に決定できる。","区分所有者全員の個別同意が必ず必要である。"],"a":0,"ex":"実務では法令・規約・契約を確認する。今回のポイントは「副理事長は、理事長を補佐し、理事長に事故があるとき等には職務を代理・代行する。」。","level":"A"},{"id":230,"cat":"マンション管理適正化法","type":"4択","q":"次の記述のうち、正しいものはどれか。【分別管理の目的】","choices":["分別管理は、管理組合財産を管理業者の固有財産等と区別して管理し、財産の保全を図るための制度である。 ただし、管理会社が単独で自由に変更できる。","分別管理は、管理組合財産を管理業者の固有財産等と区別して管理し、財産の保全を図るための制度である。","この論点は管理業務主任者試験の対象外である。","法律・規約にかかわらず理事長が単独で決定できる。"],"a":1,"ex":"正解は②。分別管理は、管理組合財産を管理業者の固有財産等と区別して管理し、財産の保全を図るための制度である。","level":"A"},{"id":231,"cat":"標準管理規約","type":"事例","q":"【事例】マンション管理の実務で「理事長」について確認することになった。最も適切な説明はどれか。","choices":["理事長は、管理組合を代表し、業務を統括する。","法律や規約より管理会社の社内ルールが常に優先する。","理事長が単独で自由に決定できる。","区分所有者全員の個別同意が必ず必要である。"],"a":0,"ex":"実務では法令・規約・契約を確認する。今回のポイントは「理事長は、管理組合を代表し、業務を統括する。」。","level":"A"},{"id":232,"cat":"マンション管理適正化法","type":"4択","q":"次の記述のうち、正しいものはどれか。【登録の有効期間】","choices":["マンション管理業者の登録の有効期間は3年である。","マンション管理業者の登録の有効期間は5年である。","この論点は管理業務主任者試験の対象外である。","法律・規約にかかわらず理事長が単独で決定できる。"],"a":1,"ex":"正解は②。マンション管理業者の登録の有効期間は5年である。","level":"A"},{"id":233,"cat":"区分所有法","type":"正誤","q":"次の記述は正しいか。\n「共用部分の変更のうち、その形状又は効用の著しい変更を伴うものは、原則として区分所有者及び議決権の各4分の3以上の多数による決議が必要。」","choices":["正しい","誤り","どちらともいえない","規定されていない"],"a":0,"ex":"【区分所有法／共用部分の重大変更】共用部分の変更のうち、その形状又は効用の著しい変更を伴うものは、原則として区分所有者及 約に別段の定めがない限り、集会の決議によって選任する。","level":"B"},{"id":331,"cat":"区分所有法","type":"4択","q":"次の記述のうち、正しいものはどれか。【共用部分の持分】","choices":["各区分所有者の共用部分の持分は、必ずその有する専有部分の床面積の割合による。","各区分所有者の共用部分の持分は、原則としてその有する専有部分の床面積の割合による。","この論点は管理業務主任者試験の対象外である。","法律・規約にかかわらず理事長が単独で決定できる。"],"a":1,"ex":"正解は②。各区分所有者の共用部分の持分は、原則としてその有する専有部分の床面積の割合による。","level":"A"},{"id":332,"cat":"区分所有法","type":"正誤","q":"次の記述は正しいか。\n「専有部分の床面積は、壁その他の区画の内側線で囲まれた部分の水平投影面積による。」","choices":["正しい","誤り","どちらともいえない","規定されていない"],"a":0,"ex":"【区分所有法／専有部分の床面積】専有部分の床面積は、壁その他の区画の内側線で囲まれた部分の水平投影面積による。","level":"A"},{"id":333,"cat":"マンション管理適正化法","type":"4択","q":"次の記述のうち、【誤っているもの】はどれか。【管理計画認定】","choices":["管理計画認定制度では、一定の基準を満たすマンションの管理計画について認定を受けることができる。","管理会社の判断だけで常に変更できる。","区分所有者全員の個別同意が常に必要である。","この論点には法令・規約上のルールが存在しない。"],"a":1,"ex":"誤りは②。基準となる内容は「管理計画認定制度では、一定の基準を満たすマンションの管理計画について認定を受けることができる。」。","level":"A"},{"id":334,"cat":"マンション管理適正化法","type":"確認","q":"「管理者管理方式」について、最も適切な説明はどれか。","choices":["2026年4月施行の改正に向け、管理業者管理者方式に対応した標準管理者事務委託契約書等が整備された。","この制度は必ず反対の扱いになる。","管理組合には一切関係しない。","規約より常に管理会社の判断が優先する。"],"a":0,"ex":"ポイント：2026年4月施行の改正に向け、管理業者管理者方式に対応した標準管理者事務委託契約書等が整備された。","level":"B"},{"id":335,"cat":"区分所有法","type":"確認","q":"「規約の設定・変更・廃止」について、最も適切な説明はどれか。","choices":["規約の設定、変更又は廃止は、原則として区分所有者及び議決権の各4分の3以上の多数による集会の決議による。","この制度は必ず反対の扱いになる。","管理組合には一切関係しない。","規約より常に管理会社の判断が優先する。"],"a":0,"ex":"ポイント：規約の設定、変更又は廃止は、原則として区分所有者及び議決権の各4分の3以上の多数による集会の決議による。","level":"B"},{"id":336,"cat":"管理委託契約","type":"正誤","q":"次の記述は正しいか。\n「清掃業務は、管理委託契約に定める場合、管理会社が実施又は再委託する業務となる。」","choices":["正しい","誤り","どちらともいえない","規定されていない"],"a":0,"ex":"【管理委託契約／清掃業務】清掃業務は、管理委託契約に定める場合、管理会社が実施又は再委託する業務となる。","level":"B"},{"id":337,"cat":"マンション管理適正化法","type":"4択","q":"次の記述のうち、【誤っているもの】はどれか。【監督処分】","choices":["国土交通大臣は、法令違反等に対してマンション管理業者に監督処分を行うことができる。","管理会社の判断だけで常に変更できる。","区分所有者全員の個別同意が常に必要である。","この論点には法令・規約上のルールが存在しない。"],"a":1,"ex":"誤りは②。基準となる内容は「国土交通大臣は、法令違反等に対してマンション管理業者に監督処分を行うことができる。」。","level":"A"},{"id":338,"cat":"管理委託契約","type":"4択","q":"次の記述のうち、【誤っているもの】はどれか。【契約期 ・規約にかかわらず理事長が単独で決定できる。"],"a":1,"ex":"正解は②。2025年10月17日に、改正区分所有法等を踏まえたマンション標準管理規約が改正された。","level":"A"},{"id":346,"cat":"区分所有法","type":"正誤","q":"次の記述は正しいか。\n「区分所有者は、全員で、建物並びにその敷地及び附属施設の管理を行うための団体を構成する。」","choices":["正しい","誤り","どちらともいえない","規定されていない"],"a":0,"ex":"【区分所有法／区分所有者の団体】区分所有者は、全員で、建物並びにその敷地及び附属施設の管理を行うための団体を構成する。","level":"A"},{"id":347,"cat":"区分所有法","type":"4択","q":"次の記述のうち、正しいものはどれか。【議決権】","choices":["各区分所有者の議決権は、規約に別段の定めがない限り、共用部分の持分の割合による。 ただし、管理会社が単独で自由に変更できる。","各区分所有者の議決権は、規約に別段の定めがない限り、共用部分の持分の割合による。","この論点は管理業務主任者試験の対象外である。","法律・規約にかかわらず理事長が単独で決定できる。"],"a":1,"ex":"正解は②。各区分所有者の議決権は、規約に別段の定めがない限り、共用部分の持分の割合による。","level":"A"},{"id":348,"cat":"マンション管理適正化法","type":"確認","q":"「管理計画認定」について、最も適切な説明はどれか。","choices":["管理計画認定制度では、一定の基準を満たすマンションの管理計画について認定を受けることができる。","この制度は必ず反対の扱いになる。","管理組合には一切関係しない。","規約より常に管理会社の判断が優先する。"],"a":0,"ex":"ポイント：管理計画認定制度では、一定の基準を満たすマンションの管理計画について認定を受けることができる。","level":"B"},{"id":349,"cat":"標準管理規約","type":"確認","q":"「理事会」について、最も適切な説明はどれか。","choices":["理事会は、理事長が招集する。","この制度は必ず反対の扱いになる。","管理組合には一切関係しない。","規約より常に管理会社の判断が優先する。"],"a":0,"ex":"ポイント：理事会は、理事長が招集する。","level":"B"},{"id":350,"cat":"区分所有法","type":"4択","q":"次の記述のうち、【誤っているもの】はどれか。【修繕積立金の使途】","choices":["2025年改正の標準管理規約では、区分所有法改正を踏まえて修繕積立金の使途が見直された。","管理会社の判断だけで常に変更できる。","区分所有者全員の個別同意が常に必要である。","この論点には法令・規約上のルールが存在しない。"],"a":1,"ex":"誤りは②。基準となる内容は「2025年改正の標準管理規約では、区分所有法改正を踏まえて修繕積立金の使途が見直された。」。","level":"A"},{"id":351,"cat":"管理委託契約","type":"正誤","q":"次の記述は正しいか。\n「管理会社は、委託された管理事務を善良な管理者の注意をもって処理する。」","choices":["正しい","誤り","どちらともいえない","規定されていない"],"a":0,"ex":"【管理委託契約／善管注意義務】管理会社は、委託された管理事務を善良な管理者の注意をもって処理する。","level":"B"},{"id":352,"cat":"会計","type":"4択","q":"次の記述のうち、【誤っているもの】はどれか。【現金収入】","choices":["管理費を現金で受け取った場合、現金は借方、管理費収入は貸方に記録する。","管理会社の判断だけで常に変更できる。","区分所有者全員の個別同意が常に必要である。","この論点には法令・規約上のルールが存在しない。"],"a":1,"ex":"誤りは②。基準となる内容は「管理費を現金で受け取った場合、現金は借方、管理費収入は貸方に記録する。」。","level":"B"},{"id":353,"cat":"会計","type":"4択","q":"次の記述のうち、正しいものはどれか。【負債増加の仕訳】","choices":["負債が増加する取引は、原則として借方に記録する。","負債が増加す 等に関する国内管理人制度が設けられた。","level":"A"},{"id":383,"cat":"標準管理規約","type":"確認","q":"「修繕積立金」について、最も適切な説明はどれか。","choices":["修繕積立金は、計画的な修繕その他一定の修繕等のために積み立てる。","この制度は必ず反対の扱いになる。","管理組合には一切関係しない。","規約より常に管理会社の判断が優先する。"],"a":0,"ex":"ポイント：修繕積立金は、計画的な修繕その他一定の修繕等のために積み立てる。","level":"B"},{"id":384,"cat":"会計","type":"4択","q":"次の記述のうち、【誤っているもの】はどれか。【修繕積立金の目的】","choices":["修繕積立金は、将来の大規模修繕等に備えて積み立てる。","管理会社の判断だけで常に変更できる。","区分所有者全員の個別同意が常に必要である。","この論点には法令・規約上のルールが存在しない。"],"a":1,"ex":"誤りは②。基準となる内容は「修繕積立金は、将来の大規模修繕等に備えて積み立てる。」。","level":"B"},{"id":385,"cat":"会計","type":"事例","q":"【事例】マンション管理の実務で「現金収入」について確認することになった。最も適切な説明はどれか。","choices":["管理費を現金で受け取った場合、現金は借方、管理費収入は貸方に記録する。","法律や規約より管理会社の社内ルールが常に優先する。","理事長が単独で自由に決定できる。","区分所有者全員の個別同意が必ず必要である。"],"a":0,"ex":"実務では法令・規約・契約を確認する。今回のポイントは「管理費を現金で受け取った場合、現金は借方、管理費収入は貸方に記録する。」。","level":"B"},{"id":386,"cat":"管理委託契約","type":"正誤","q":"次の記述は正しいか。\n「管理組合の管理に関する情報について、宅地建物取引業者等から一定の照会を受けることがある。」","choices":["正しい","誤り","どちらともいえない","規定されていない"],"a":0,"ex":"【管理委託契約／重要事項調査】管理組合の管理に関する情報について、宅地建物取引業者等から一定の照会を受けることがある。","level":"B"},{"id":387,"cat":"標準管理規約","type":"正誤","q":"次の記述は正しいか。\n「組合員の資格は、原則として当該マンションの区分所有者となったときに取得し、区分所有者でなくなったときに喪失する。」","choices":["正しい","誤り","どちらともいえない","規定されていない"],"a":0,"ex":"【標準管理規約／組合員の資格】組合員の資格は、原則として当該マンションの区分所有者となったときに取得し、区分所有者でなくなったときに喪失する。","level":"A"},{"id":388,"cat":"管理委託契約","type":"事例","q":"【事例】マンション管理の実務で「建物設備管理」について確認することになった。最も適切な説明はどれか。","choices":["建物・設備等の保守点検は、委託契約の内容に応じて管理会社が実施又は手配する。","法律や規約より管理会社の社内ルールが常に優先する。","理事長が単独で自由に決定できる。","区分所有者全員の個別同意が必ず必要である。"],"a":0,"ex":"実務では法令・規約・契約を確認する。今回のポイントは「建物・設備等の保守点検は、委託契約の内容に応じて管理会社が実施又は手配する。」。","level":"B"},{"id":389,"cat":"区分所有法","type":"正誤","q":"次の記述は正しいか。\n「建物の建替えは、区分所有法所定の要件を満たす集会決議によって行うことができる。」","choices":["正しい","誤り","どちらともいえない","規定されていない"],"a":0,"ex":"【区分所有法／建替え決議】建物の建替えは、区分所有法所定の要件を満たす集会決議によって行うことができる。","level":"A"},{"id":390,"cat":"マンション管理適正化法","type":"4択","q":"次の記述のうち、【誤っているもの】はどれか。【管理事務の報告】","choices":["管理業務主任者は、管理組合に対し、管理事務に関する報告を行う。","管理会社の判断だけで常に変更できる。","区分所有者全員の個別同意が常に必要である。","この論点には法令・規約上のルールが存在しない。"],"a":1,"ex":"誤りは②。基準となる内容は「管理業務主任者は、管理組合に対し、管理事務に関する報告を行う。」。","level":"A"},{"id":391,"cat":"区分所有法","type":"事例","q":"【事例】マンション管理の実務で「規約の保管」について確認することになった。最も適切な説明はどれか。","choices":["規約は、管理者が保管する。ただし、管理者がないときは、規約又は集会の決議で定めた区分所有者が保管する。","法律や規約より管理会社の社内ルールが常に優先する。","理事長が単独で自由に決定できる。","区分所有者全員の個別同意が必ず必要である。"],"a":0,"ex":"実務では法令・規約・契約を確認する。今回のポイントは「規約は、管理者が保管する。ただし、管理者がないときは、規約又は集会の決議で定めた区分所有者が保管する。」。","level":"A"},{"id":392,"cat":"管理委託契約","type":"確認","q":"「事務管理業務」について、最も適切な説明はどれか。","choices":["管理委託契約では、会計の収支状況の把握や管理費等の収納などが事務管理業務に含まれる。","この制度は必ず反対の扱いになる。","管理組合には一切関係しない。","規約より常に管理会社の判断が優先する。"],"a":0,"ex":"ポイント：管理委託契約では、会計の収支状況の把握や管理費等の収納などが事務管理業務に含まれる。","level":"C"},{"id":393,"cat":"区分所有法","type":"4択","q":"次の記述のうち、【誤っているもの】はどれか。【管理者の解任】","choices":["管理者は、規約に別段の定めがない限り、集会の決議によって解任することができる。","管理会社の判断だけで常に変更できる。","区分所有者全員の個別同意が常に必要である。","この論点には法令・規約上のルールが存在しない。"],"a":1,"ex":"誤りは②。基準となる内容は「管理者は、規約に別段の定めがない限り、集会の決議によって解任することができる。」。","level":"A"},{"id":394,"cat":"会計","type":"4択","q":"次の記述のうち、【誤っているもの】はどれか。【監査】","choices":["監事は、管理組合の財産の状況等を監査し、総会に報告する。","管理会社の判断だけで常に変更できる。","区分所有者全員の個別同意が常に必要である。","この論点には法令・規約上のルールが存在しない。"],"a":1,"ex":"誤りは②。基準となる内容は「監事は、管理組合の財産の状況等を監査し、総会に報告する。」。","level":"B"},{"id":395,"cat":"会計","type":"正誤","q":"次の記述は正しいか。\n「収支計算書は、一定期間の収入と支出の状況を把握するために用いられる。」","choices":["正しい","誤り","どちらともいえない","規定されていない"],"a":0,"ex":"【会計／収支計算書】収支計算書は、一定期間の収入と支出の状況を把握するために用いられる。","level":"B"},{"id":396,"cat":"マンション管理適正化法","type":"4択","q":"次の記述のうち、正しいものはどれか。【管理者管理方式】","choices":["2026年4月施行の改正に向け、管理業者管理者方式に対応した標準管理者事務委託契約書等が整備された。 ただし、管理会社が単独で自由に変更できる。","2026年4月施行の改正に向け、管理業者管理者方式に対応した標準管理者事務委託契約書等が整備された。","この論点は管理業務主任者試験の対象外である。","法律・規約にかかわらず理事長が単独で決定できる。"],"a":1,"ex":"正解は②。2026年4月施行の改正に向け、管理業者管理者方式に対応した標準管理者事務委託契約書等が整備された。","level":"A"},{"id":397,"cat":"標準管理規約","type":"確認","q":"「専有部分の修繕」について、最も適切な説明はどれか。","choices":["専有部分の修繕等が共用部分や他の専有部分に影響を及ぼすおそれがある場合、一定の承認等が必要となる。","この制度は必ず反対の扱いになる。","管理組合には一切関係しない。","規約より常に管理会社の判断が優先する。"],"a":0,"e B"},{"id":428,"cat":"会計","type":"4択","q":"次の記述のうち、正しいものはどれか。【管理費と修繕積立金】","choices":["管理費と修繕積立金は、その目的・使途が異なるため区分して管理することが重要である。 ただし、管理会社が単独で自由に変更できる。","管理費と修繕積立金は、その目的・使途が異なるため区分して管理することが重要である。","この論点は管理業務主任者試験の対象外である。","法律・規約にかかわらず理事長が単独で決定できる。"],"a":1,"ex":"正解は②。管理費と修繕積立金は、その目的・使途が異なるため区分して管理することが重要である。","level":"B"},{"id":429,"cat":"マンション管理適正化法","type":"4択","q":"次の記述のうち、【誤っているもの】はどれか。【登録の有効期間】","choices":["マンション管理業者の登録の有効期間は5年である。","管理会社の判断だけで常に変更できる。","区分所有者全員の個別同意が常に必要である。","この論点には法令・規約上のルールが存在しない。"],"a":1,"ex":"誤りは②。基準となる内容は「マンション管理業者の登録の有効期間は5年である。」。","level":"A"},{"id":430,"cat":"管理委託契約","type":"4択","q":"次の記述のうち、正しいものはどれか。【標準管理委託契約書改正】","choices":["2023年12月12日、国土交通省は管理業者管理者方式等を踏まえ標準管理委託契約書を改正した。","2025年12月12日、国土交通省は管理業者管理者方式等を踏まえ標準管理委託契約書を改正した。","この論点は管理業務主任者試験の対象外である。","法律・規約にかかわらず理事長が単独で決定できる。"],"a":1,"ex":"正解は②。2025年12月12日、国土交通省は管理業者管理者方式等を踏まえ標準管理委託契約書を改正した。","level":"B"},{"id":431,"cat":"管理委託契約","type":"事例","q":"【事例】マンション管理の実務で「標準管理委託契約書改正」について確認することになった。最も適切な説明はどれか。","choices":["2025年12月12日、国土交通省は管理業者管理者方式等を踏まえ標準管理委託契約書を改正した。","法律や規約より管理会社の社内ルールが常に優先する。","理事長が単独で自由に決定できる。","区分所有者全員の個別同意が必ず必要である。"],"a":0,"ex":"実務では法令・規約・契約を確認する。今回のポイントは「2025年12月12日、国土交通省は管理業者管理者方式等を踏まえ標準管理委託契約書を改正した。」。","level":"B"},{"id":432,"cat":"会計","type":"事例","q":"【事例】マンション管理の実務で「滞納管理費」について確認することになった。最も適切な説明はどれか。","choices":["管理費等の滞納は、管理組合の収入不足や資金繰りに影響するため適切な管理が必要である。","法律や規約より管理会社の社内ルールが常に優先する。","理事長が単独で自由に決定できる。","区分所有者全員の個別同意が必ず必要である。"],"a":0,"ex":"実務では法令・規約・契約を確認する。今回のポイントは「管理費等の滞納は、管理組合の収入不足や資金繰りに影響するため適切な管理が必要である。」。","level":"B"},{"id":433,"cat":"標準管理規約","type":"事例","q":"【事例】マンション管理の実務で「議決権行使書」について確認することになった。最も適切な説明はどれか。","choices":["組合員は、総会に出席できない場合、議決権行使書等により議決権を行使できる。","法律や規約より管理会社の社内ルールが常に優先する。","理事長が単独で自由に決定できる。","区分所有者全員の個別同意が必ず必要である。"],"a":0,"ex":"実務では法令・規約・契約を確認する。今回のポイントは「組合員は、総会に出席できない場合、議決権行使書等により議決権を行使できる。」。","level":"A"},{"id":434,"cat":"区分所有法","type":"確認","q":"「集会招集請求」について、最も適切な説明はどれか。","choices":["区分所有者の5分の1以上で議決権の5分の1以上を有する者は、規約に別段の定めがなければ、管理者に集会の招集を請求できる。","この制度は必ず反対の扱いになる。","管理組合には一切関係しない。","規約より常に管理会社の判断が優先する。"],"a":0,"ex":"ポイント：区分所有者の5分の1以上で議決権の5分の1以上を有する者は、規約に別段の定めがなければ、管理者に集会の招集を請求できる。","level":"B"},{"id":435,"cat":"標準管理規約","type":"4択","q":"次の記述のうち、【誤っているもの】はどれか。【議決権】","choices":["組合員は、総会において議決権を行使することができる。","管理会社の判断だけで常に変更できる。","区分所有者全員の個別同意が常に必要である。","この論点には法令・規約上のルールが存在しない。"],"a":1,"ex":"誤りは②。基準となる内容は「組合員は、総会において議決権を行使することができる。」。","level":"A"},{"id":436,"cat":"マンション管理適正化法","type":"4択","q":"次の記述のうち、正しいものはどれか。【秘密保持】","choices":["マンション管理業者及びその従業者には、正当な理由なく業務上知り得た秘密を漏らしてはならない等の規律がある。 ただし、管理会社が単独で自由に変更できる。","マンション管理業者及びその従業者には、正当な理由なく業務上知り得た秘密を漏らしてはならない等の規律がある。","この論点は管理業務主任者試験の対象外である。","法律・規約にかかわらず理事長が単独で決定できる。"],"a":1,"ex":"正解は②。マンション管理業者及びその従業者には、正当な理由なく業務上知り得た秘密を漏らしてはならない等の規律がある。","level":"A"},{"id":437,"cat":"マンション管理適正化法","type":"事例","q":"【事例】マンション管理の実務で「罰則」について確認することになった。最も適切な説明はどれか。","choices":["マンション管理適正化法には、違反行為に応じた罰則が定められている。","法律や規約より管理会社の社内ルールが常に優先する。","理事長が単独で自由に決定できる。","区分所有者全員の個別同意が必ず必要である。"],"a":0,"ex":"実務では法令・規約・契約を確認する。今回のポイントは「マンション管理適正化法には、違反行為に応じた罰則が定められている。」。","level":"A"},{"id":438,"cat":"区分所有法","type":"事例","q":"【事例】マンション管理の実務で「共用部分の重大変更」について確認することになった。最も適切な説明はどれか。","choices":["共用部分の変更のうち、その形状又は効用の著しい変更を伴うものは、原則として区分所有者及び議決権の各4分の3以上の多数による決議が必要。","法律や規約より管理会社の社内ルールが常に優先する。","理事長が単独で自由に決定できる。","区分所有者全員の個別同意が必ず必要である。"],"a":0,"ex":"実務では法令・規約・契約を確認する。今回のポイントは「共用部分の変更のうち、その形状又は効用の著しい変更を伴うものは、原則として区分所有者及び議決権の各4分の3以上の多数による決議が必要。」。","level":"A"},{"id":439,"cat":"標準管理規約","type":"正誤","q":"次の記述は正しいか。\n「組合員が管理費等を滞納した場合、管理組合は必要な措置を講ずることができる。」","choices":["正しい","誤り","どちらともいえない","規定されていない"],"a":0,"ex":"【標準管理規約／管理費等の滞納】組合員が管理費等を滞納した場合、管理組合は必要な措置を講ずることができる。","level":"A"},{"id":440,"cat":"標準管理規約","type":"4択","q":"次の記述のうち、【誤っているもの】はどれか。【総会の招集】","choices":["総会の招集は、原則として理事長が行う。","管理会社の判断だけで常に変更できる。","区分所有者全員の個別同意が常に必要である。","この論点には法令・規約上のルールが存在しない。"],"a":1,"ex":"誤りは②。基準となる内容は「総会の招集は、原則として理事長が行う。」。","level":"A"},{"id":441,"cat":"区分所有法","type":"4択","q":"次の記述のうち、【誤っているもの】はどれか。【国内管理人】","choices":["改正区分所有法では、国外居住者等に関する国内管理人制度が設けられた。","管理会社の判断だけで常に変更できる。","区分所有者全員の個別同意が常に必要である。","この論点には法令・規約上のルールが存在しない。"],"a":1,"ex":"誤りは②。基準となる内容は「改正区分所有法では、国外居住者等に関する国内管理人制度が設けられた。」。","level":"A"},{"id":442,"cat":"管理委託契約","type":"4択","q":"次の記述のうち、正しいものはどれか。【再委託】","choices":["管理会社が一部業務を第三者に再委託する場合は、法令及び契約に従う。 ただし、管理会社が単独で自由に変更できる。","管理会社が一部業務を第三者に再委託する場合は、法令及び契約に従う。","この論点は管理業務主任者試験の対象外である。","法律・規約にかかわらず理事長が単独で決定できる。"],"a":1,"ex":"正解は②。管理会社が一部業務を第三者に再委託する場合は、法令及び契約に従う。","level":"B"},{"id":443,"cat":"標準管理規約","type":"4択","q":"次の記述のうち、【誤っているもの】はどれか。【専有部分の修繕】","choices":["専有部分の修繕等が共用部分や他の専有部分に影響を及ぼすおそれがある場合、一定の承認等が必要となる。","管理会社の判断だけで常に変更できる。","区分所有者全員の個別同意が常に必要である。","この論点には法令・規約上のルールが存在しない。"],"a":1,"ex":"誤りは②。基準となる内容は「専有部分の修繕等が共用部分や他の専有部分に影響を及ぼすおそれがある場合、一定の承認等が必要となる。」。","level":"A"},{"id":444,"cat":"標準管理規約","type":"確認","q":"「組合員の資格」について、最も適切な説明はどれか。","choices":["組合員の資格は、原則として当該マンションの区分所有者となったときに取得し、区分所有者でなくなったときに喪失する。","この制度は必ず反対の扱いになる。","管理組合には一切関係しない。","規約より常に管理会社の判断が優先する。"],"a":0,"ex":"ポイント：組合員の資格は、原則として当該マンションの区分所有者となったときに取得し、区分所有者でなくなったときに喪失する。","level":"B"},{"id":445,"cat":"区分所有法","type":"4択","q":"次の記述のうち、正しいものはどれか。【規約の保管】","choices":["規約は、管理者が保管する。ただし、管理者がないときは、規約又は集会の決議で定めた区分所有者が保管する。 ただし、管理会社が単独で自由に変更できる。","規約は、管理者が保管する。ただし、管理者がないときは、規約又は集会の決議で定めた区分所有者が保管する。","この論点は管理業務主任者試験の対象外である。","法律・規約にかかわらず理事長が単独で決定できる。"],"a":1,"ex":"正解は②。規約は、管理者が保管する。ただし、管理者がないときは、規約又は集会の決議で定めた区分所有者が保管する。","level":"A"},{"id":446,"cat":"マンション管理適正化法","type":"正誤","q":"次の記述は正しいか。\n「管理業者管理者方式では、管理者と管理業者との利益相反のおそれに配慮した規律が重要となる。」","choices":["正しい","誤り","どちらともいえない","規定されていない"],"a":0,"ex":"【マンション管理適正化法／利益相反】管理業者管理者方式では、管理者と管理業者との利益相反のおそれに配慮した規律が重要となる。","level":"A"},{"id":447,"cat":"区分所有法","type":"4択","q":"次の記述のうち、【誤っているもの】はどれか。【集会招集請求】","choices":["区分所有者の5分の1以上で議決権の5分の1以上を有する者は、規約に別段の定めがなければ、管理者に集会の招集を請求できる。","管理会社の判断だけで常に変更できる。","区分所有者全員の個別同意が常に必要である。","この論点には法令・規約上のルールが存在しない。"],"a":1,"ex":"誤りは②。基準となる内容は「区分所有者の5分の1以上で議決権の5分の1以上を有する者は、規約に別段の定めがなければ、管理者に集会の招集を請求できる。」。","level":"A"},{"id":448,"cat":"管理委託契約","type":"正誤","q":"次の記述は正しいか。\n「管理委託契約では、会計の収支状況の把握や管理費等の収納などが事務管理業務に含まれる。」","choices":["正しい","誤り","どちらともいえない","規定されていない"],"a":0,"ex":"【管理委託契約／事務管理業務】管理委託契約では、会計の収支状況の把握や管理費等の収納などが事務管理業務に含まれる。","level":"B"},{"id":449,"cat":"会計","type":"確認","q":"「資産増加の仕訳」について、最も適切な説明はどれか。","choices":["資産が増加する取引は、原則として借方に記録する。","この制度は必ず反対の扱いになる。","管理組合には一切関係しない。","規約より常に管理会社の判断が優先する。"],"a":0,"ex":"ポイント：資産が増加する取引は、原則として借方に記録する。","level":"C"},{"id":450,"cat":"標準管理規約","type":"4択","q":"次の記述のうち、【誤っているもの】はどれか。【理事会】","choices":["理事会は、理事長が招集する。","管理会社の判断だけで常に変更できる。","区分所有者全員の個別同意が常に必要である。","この論点には法令・規約上のルールが存在しない。"],"a":1,"ex":"誤りは②。基準となる内容は「理事会は、理事長が招集する。」。","level":"A"},{"id":451,"cat":"管理委託契約","type":"4択","q":"次の記述のうち、【誤っているもの】はどれか。【善管注意義務】","choices":["管理会社は、委託された管理事務を善良な管理者の注意をもって処理する。","管理会社の判断だけで常に変更できる。","区分所有者全員の個別同意が常に必要である。","この論点には法令・規約上のルールが存在しない。"],"a":1,"ex":"誤りは②。基準となる内容は「管理会社は、委託された管理事務を善良な管理者の注意をもって処理する。」。","level":"B"},{"id":452,"cat":"区分所有法","type":"正誤","q":"次の記述は正しいか。\n「規約の設定、変更又は廃止は、原則として区分所有者及び議決権の各4分の3以上の多数による集会の決議による。」","choices":["正しい","誤り","どちらともいえない","規定されていない"],"a":0,"ex":"【区分所有法／規約の設定・変更・廃止】規約の設定、変更又は廃止は、原則として区分所有者及び議決権の各4分の3以上の多数による集会の決議による。","level":"A"},{"id":453,"cat":"区分所有法","type":"事例","q":"【事例】マンション管理の実務で「規約原本の閲覧」について確認することになった。最も適切な説明はどれか。","choices":["利害関係人から規約の閲覧請求があった場合、正当な理由がある場合を除き、閲覧を拒むことができない。","法律や規約より管理会社の社内ルールが常に優先する。","理事長が単独で自由に決定できる。","区分所有者全員の個別同意が必ず必要である。"],"a":0,"ex":"実務では法令・規約・契約を確認する。今回のポイントは「利害関係人から規約の閲覧請求があった場合、正当な理由がある場合を除き、閲覧を拒むことができない。」。","level":"A"},{"id":454,"cat":"標準管理規約","type":"4択","q":"次の記述のうち、【誤っているもの】はどれか。【総会議事録】","choices":["総会の議事については、議事録を作成し、所定の方法で保管する。","管理会社の判断だけで常に変更できる。","区分所有者全員の個別同意が常に必要である。","この論点には法令・規約上のルールが存在しない。"],"a":1,"ex":"誤りは②。基準となる内容は「総会の議事については、議事録を作成し、所定の方法で保管する。」。","level":"A"},{"id":455,"cat":"マンション管理適正化法","type":"4択","q":"次の記述のうち、【誤っているもの】はどれか。【管理業者の登録】","choices":["マンション管理業を営もうとする者は、国土交通大臣の登録を受けなければならない。","管理会社の判断だけで常に変更できる。","区分所有者全員の個別同意が常に必要である。","この論点には法令・規約上のルールが存在しない。"],"a":1,"ex":"誤りは②。基準となる内容は「マンション管理業を営もうとする者は、国土交通大臣の登録を受けなければならない。」。","level":"A"},{"id":456,"cat":"区分所有法","type":"確認","q":"「規約の保管」について、最も適切な説明はどれか。","choices":["規約は、管理者が保管する。ただし、管理者がないときは、規約又は集会の決議で定めた区分所有者が保管する。","この制度は必ず反対の扱いになる。","管理組合には一切関係しない。","規約より常に管理会社の判断が優先する。"],"a":0,"ex":"ポイント：規約は、管理者が保管する。ただし、管理者がないときは、規約又は集会の決議で定めた区分所有者が保管する。","level":"B"},{"id":457,"cat":"区分所有法","type":"正誤","q":"次の記述は正しいか。\n「改正法では、共用部分等に係る損害賠償請求権等の代理行使に関する規律が整備された。」","choices":["正しい","誤り","どちらともいえない","規定されていない"],"a":0,"ex":"【区分所有法／損害賠償請求権等の代理行使】改正法では、共用部分等に係る損害賠償請求権等の代理行使に関する規律が整備された。","level":"A"},{"id":458,"cat":"区分所有法","type":"事例","q":"【事例】マンション管理の実務で「区分所有者の団体」について確認することになった。最も適切な説明はどれか。","choices":["区分所有者は、全員で、建物並びにその敷地及び附属施設の管理を行うための団体を構成する。","法律や規約より管理会社の社内ルールが常に優先する。","理事長が単独で自由に決定できる。","区分所有者全員の個別同意が必ず必要である。"],"a":0,"ex":"実務では法令・規約・契約を確認する。今回のポイントは「区分所有者は、全員で、建物並びにその敷地及び附属施設の管理を行うための団体を構成する。」。","level":"A"},{"id":459,"cat":"管理委託契約","type":"事例","q":"【事例】マンション管理の実務で「管理員業務」について確認することになった。最も適切な説明はどれか。","choices":["管理員業務には、受付、点検、立会い等の一定の業務が含まれる。","法律や規約より管理会社の社内ルールが常に優先する。","理事長が単独で自由に決定できる。","区分所有者全員の個別同意が必ず必要である。"],"a":0,"ex":"実務では法令・規約・契約を確認する。今回のポイントは「管理員業務には、受付、点検、立会い等の一定の業務が含まれる。」。","level":"B"},{"id":460,"cat":"区分所有法","type":"正誤","q":"次の記述は正しいか。\n「各区分所有者の共用部分の持分は、原則としてその有する専有部分の床面積の割合による。」","choices":["正しい","誤り","どちらともいえない","規定されていない"],"a":0,"ex":"【区分所有法／共用部分の持分】各区分所有者の共用部分の持分は、原則としてその有する専有部分の床面積の割合による。","level":"A"},{"id":461,"cat":"区分所有法","type":"4択","q":"次の記述のうち、【誤っているもの】はどれか。【規約の設定・変更・廃止】","choices":["規約の設定、変更又は廃止は、原則として区分所有者及び議決権の各4分の3以上の多数による集会の決議による。","管理会社の判断だけで常に変更できる。","区分所有者全員の個別同意が常に必要である。","この論点には法令・規約上のルールが存在しない。"],"a":1,"ex":"誤りは②。基準となる内容は「規約の設定、変更又は廃止は、原則として区分所有者及び議決権の各4分の3以上の多数による集会の決議による。」。","level":"A"},{"id":462,"cat":"区分所有法","type":"4択","q":"次の記述のうち、正しいものはどれか。【管理組合法人】","choices":["区分所有者及び議決権の各3分の2以上の多数による集会の決議により、管理組合法人となることができる。","区分所有者及び議決権の各4分の3以上の多数による集会の決議により、管理組合法人となることができる。","この論点は管理業務主任者試験の対象外である。","法律・規約にかかわらず理事長が単独で決定できる。"],"a":1,"ex":"正解は②。区分所有者及び議決権の各4分の3以上の多数による集会の決議により、管理組合法人となることができる。","level":"A"},{"id":463,"cat":"区分所有法","type":"事例","q":"【事例】マンション管理の実務で「保存行為」について確認することになった。最も適切な説明はどれか。","choices":["共用部分の保存行為は、各区分所有者がすることができる。","法律や規約より管理会社の社内ルールが常に優先する。","理事長が単独で自由に決定できる。","区分所有者全員の個別同意が必ず必要である。"],"a":0,"ex":"実務では法令・規約・契約を確認する。今回のポイントは「共用部分の保存行為は、各区分所有者がすることができる。」。","level":"A"},{"id":464,"cat":"管理委託契約","type":"正誤","q":"次の記述は正しいか。\n「管理会社が一部業務を第三者に再委託する場合は、法令及び契約に従う。」","choices":["正しい","誤り","どちらともいえない","規定されていない"],"a":0,"ex":"【管理委託契約／再委託】管理会社が一部業務を第三者に再委託する場合は、法令及び契約に従う。","level":"B"},{"id":465,"cat":"会計","type":"4択","q":"次の記述のうち、【誤っているもの】はどれか。【未収金】","choices":["未収の管理費等は、回収前の段階では未収金等の資産として計上する。","管理会社の判断だけで常に変更できる。","区分所有者全員の個別同意が常に必要である。","この論点には法令・規約上のルールが存在しない。"],"a":1,"ex":"誤りは②。基準となる内容は「未収の管理費等は、回収前の段階では未収金等の資産として計上する。」。","level":"B"},{"id":466,"cat":"会計","type":"4択","q":"次の記述のうち、【誤っているもの】はどれか。【前払金】","choices":["将来の費用について事前に支払った金額は、内容に応じて前払金等の資産として処理する。","管理会社の判断だけで常に変更できる。","区分所有者全員の個別同意が常に必要である。","この論点には法令・規約上のルールが存在しない。"],"a":1,"ex":"誤りは②。基準となる内容は「将来の費用について事前に支払った金額は、内容に応じて前払金等の資産として処理する。」。","level":"B"},{"id":467,"cat":"管理委託契約","type":"4択","q":"次の記述のうち、【誤っているもの】はどれか。【管理費等の収納】","choices":["管理費等の収納方法や収納口座等は、契約内容と法令に従って管理する。","管理会社の判断だけで常に変更できる。","区分所有者全員の個別同意が常に必要である。","この論点には法令・規約上のルールが存在しない。"],"a":1,"ex":"誤りは②。基準となる内容は「管理費等の収納方法や収納口座等は、契約内容と法令に従って管理する。」。","level":"B"},{"id":468,"cat":"会計","type":"事例","q":"【事例】マンション管理の実務で「会計年度」について確認することになった。最も適切な説明はどれか。","choices":["管理組合の会計年度は、標準管理規約等の規定に従う。","法律や規約より管理会社の社内ルールが常に優先する。","理事長が単独で自由に決定できる。","区分所有者全員の個別同意が必ず必要である。"],"a":0,"ex":"実務では法令・規約・契約を確認する。今回のポイントは「管理組合の会計年度は、標準管理規約等の規定に従う。」。","level":"B"},{"id":469,"cat":"標準管理規約","type":"正誤","q":"次の記述は正しいか。\n「総会の議事については、議事録を作成し、所定の方法で保管する。」","choices":["正しい","誤り","どちらともいえない","規定されていない"],"a":0,"ex":"【標準管理規約／総会議事録】総会の議事については、議事録を作成し、所定の方法で保管する。","level":"A"},{"id":470,"cat":"標準管理規約","type":"4択","q":"次の記述のうち、【誤っているもの】はどれか。【理事長】","choices":["理事長は、管理組合を代表し、業務を統括する。","管理会社の判断だけで常に変更できる。","区分所有者全員の個別同意が常に必要である。","この論点には法令・規約上のルールが存在しない。"],"a":1,"ex":"誤りは②。基準となる内 const KEY='kanri2026_v1';
let state=JSON.parse(localStorage.getItem(KEY)||'{"done":{},"wrong":{},"fav":{}}'),deck=[],pos=0,score=0,answered=false,current=null,lastMode='random';
function save(){localStorage.setItem(KEY,JSON.stringify(state));updateStats()}
function updateStats(){let done=Object.keys(state.done).length,fav=Object.keys(state.fav).length,wrong=Object.keys(state.wrong).length,s=0,n=0;
Object.values(state.done).forEach(v=>{s+=v?1:0;n++});document.getElementById('done').textContent=done;document.getElementById('wrongCount').textContent=wrong;document.getElementById('favCount').textContent=fav;document.getElementById('rate').textContent=n?Math.round(s/n*100)+'%':'—'}
function hideAll(){['home','cats','quiz','result'].forEach(id=>document.getElementById(id).classList.add('hidden'))}
function goHome(){hideAll();document.getElementById('home').classList.remove('hidden');updateStats()}
function showCategories(){hideAll();document.getElementById('cats').classList.remove('hidden');let cats=[...new Set(QUESTIONS.map(q=>q.cat))];
document.getElementById('catButtons').innerHTML=cats.map(c=>`<button onclick="startCat('${c}')">📖 ${c}<br><small>${QUESTIONS.filter(q=>q.cat===c).length}問</small></button>`).join('')}
function startCat(cat){deck=QUESTIONS.filter(q=>q.cat===cat);shuffle(deck);deck=deck.slice(0,20);begin('category')}
function start(mode){lastMode=mode;if(mode==='wrong')deck=QUESTIONS.filter(q=>state.wrong[q.id]);else if(mode==='fav')deck=QUESTIONS.filter(q=>state.fav[q.id]);else deck=[...QUESTIONS];
if(!deck.length){alert(mode==='wrong'?'まだ間違えた問題がありません。':'まだお気に入りがありません。');return}shuffle(deck);deck=deck.slice(0,mode==='exam'?50:10);begin(mode)}
function begin(mode){lastMode=mode;pos=0;score=0;hideAll();document.getElementById('quiz').classList.remove('hidden');render()}
function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function render(){current=deck[pos];answered=false;document.getElementById('qnum').textContent=`${pos+1} / ${deck.length}`;
document.getElementById('prog').max=deck.length;document.getElementById('prog').value=pos;document.getElementById('badge').textContent=current.cat+'｜'+current.type;
document.getElementById('favBtn').textContent=state.fav[current.id]?'★ お気に入り解除':'☆ お気に入り';document.getElementById('question').textContent=current.q;
document.getElementById('choices').innerHTML=current.choices.map((c,i)=>`<button class="choice" onclick="answer(${i})">${String.fromCharCode(65+i)}．${c}</button>`).join('');
let fb=document.getElementById('feedback');fb.classList.add('hidden');fb.innerHTML='';document.getElementById('nextBtn').classList.add('hidden')}
function answer(i){if(answered)return;answered=true;let bs=[...document.querySelectorAll('.choice')];bs.forEach((b,k)=>{if(k===current.a)b.classList.add('correct');if(k===i&&i!==current.a)b.classList.add('wrong')});
let ok=i===current.a;if(ok)score++;state.done[current.id]=ok;if(!ok)state.wrong[current.id]=true;else delete state.wrong[current.id];save();
let fb=document.getElementById('feedback');fb.classList.remove('hidden');fb.innerHTML=`<b>${ok?'⭕ 正解！':'❌ 不正解'}</b><br>${current.ex}`;
document.getElementById('nextBtn').textContent=pos===deck.length-1?'結果を見る →':'次の問題 →';document.getElementById('nextBtn').classList.remove('hidden')}
function next(){if(pos===deck.length-1)finish();else{pos++;render()}}
function finish(){hideAll();document.getElementById('result').classList.remove('hidden');let pct=Math.round(score/deck.length*100);
document.getElementById('score').textContent=`${score} / ${deck.length}（${pct}%）`;document.getElementById('resultMsg').textContent=pct>=80?'かなり良い。40点台を狙える状態。':pct>=60?'いい感じ。間違い問題を潰して再挑戦。':'ここから伸ばそう。まず間違い問題を重点復習。'}
function toggleFav(){if(state.fav[current.id])delete state.fav[current.id];else state.fav[current.id]=true;save();document.getElementById('favBtn').textContent=state.fav[current.id]?'★ お気に入り解除':'☆ お気に入り'}
function resetProgress(){if(confirm('成績・間違い・お気に入りをすべて消します。よろしい？')){state={done:{},wrong:{},fav:{}};save()}}
updateStats();
</script></body></html>

const KEY='kanri2026_v3';
let state=JSON.parse(localStorage.getItem(KEY)||'{"done":{},"wrong":{},"fav":{}}'),deck=[],pos=0,score=0,answered=false,current=null,lastMode='random';
function save(){localStorage.setItem(KEY,JSON.stringify(state));updateStats()}
function updateStats(){let done=Object.keys(state.done).length,fav=Object.keys(state.fav).length,wrong=Object.keys(state.wrong).length,s=0,n=0;
Object.values(state.done).forEach(v=>{s+=v?1:0;n++});document.getElementById('done').textContent=done;document.getElementById('wrongCount').textContent=wrong;document.getElementById('favCount').textContent=fav;document.getElementById('rate').textContent=n?Math.round(s/n*100)+'%':'—'}
function hideAll(){['home','cats','quiz','result'].forEach(id=>document.getElementById(id).classList.add('hidden'))}
function goHome(){hideAll();document.getElementById('home').classList.remove('hidden');updateStats()}
function showCategories(){hideAll();document.getElementById('cats').classList.remove('hidden');let cats=[...new Set(QUESTIONS.map(q=>q.cat))];
document.getElementById('catButtons').innerHTML=cats.map(c=>`<button onclick="startCat(${JSON.stringify(c)})">📖 ${c}<br><small>${QUESTIONS.filter(q=>q.cat===c).length}問</small></button>`).join('')}
function startCat(cat){deck=QUESTIONS.filter(q=>q.cat===cat);shuffle(deck);deck=deck.slice(0,20);begin('category')}
function start(mode){lastMode=mode;
if(mode==='wrong')deck=QUESTIONS.filter(q=>state.wrong[q.id]);
else if(mode==='fav')deck=QUESTIONS.filter(q=>state.fav[q.id]);
else if(mode==='past')deck=QUESTIONS.filter(q=>q.tag==='過去問論点');
else if(mode==='reform')deck=QUESTIONS.filter(q=>q.tag==='2026改正');
else deck=[...QUESTIONS];
if(!deck.length){alert(mode==='wrong'?'まだ間違えた問題がありません。':mode==='fav'?'まだお気に入りがありません。':'問題がありません。');return}
shuffle(deck);deck=deck.slice(0,mode==='exam'?50:10);begin(mode)}
function begin(mode){lastMode=mode;pos=0;score=0;hideAll();document.getElementById('quiz').classList.remove('hidden');render()}
function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function render(){current=deck[pos];answered=false;document.getElementById('qnum').textContent=`${pos+1} / ${deck.length}`;
document.getElementById('prog').max=deck.length;document.getElementById('prog').value=pos;document.getElementById('badge').textContent=current.cat+'｜'+current.kind;document.getElementById('sourceBadge').textContent=current.tag;
document.getElementById('favBtn').textContent=state.fav[current.id]?'★ お気に入り解除':'☆ お気に入り';document.getElementById('question').textContent=current.q;
document.getElementById('choices').innerHTML=current.choices.map((c,i)=>`<button class="choice" onclick="answer(${i})">${String.fromCharCode(65+i)}．${c}</button>`).join('');
let fb=document.getElementById('feedback');fb.classList.add('hidden');fb.innerHTML='';document.getElementById('nextBtn').classList.add('hidden')}
function answer(i){if(answered)return;answered=true;let bs=[...document.querySelectorAll('.choice')];bs.forEach((b,k)=>{if(k===current.a)b.classList.add('correct');if(k===i&&i!==current.a)b.classList.add('wrong')});
let ok=i===current.a;if(ok)score++;state.done[current.id]=ok;if(!ok)state.wrong[current.id]=true;else delete state.wrong[current.id];save();
let fb=document.getElementById('feedback');fb.classList.remove('hidden');fb.innerHTML=`<b>${ok?'⭕ 正解！':'❌ 不正解'}</b><br>${current.ex}`;
document.getElementById('nextBtn').textContent=pos===deck.length-1?'結果を見る →':'次の問題 →';document.getElementById('nextBtn').classList.remove('hidden')}
function next(){if(pos===deck.length-1)finish();else{pos++;render()}}
function finish(){hideAll();document.getElementById('result').classList.remove('hidden');let pct=Math.round(score/deck.length*100);document.getElementById('score').textContent=`${score} / ${deck.length}（${pct}%）`;document.getElementById('resultMsg').textContent=pct>=80?'かなり良い。次は間違い問題を潰そう。':pct>=60?'合格圏まであと一歩。間違い問題を重点復習。':'ここから伸ばせる。まず苦手分野を集中攻略。'}
function toggleFav(){if(state.fav[current.id])delete state.fav[current.id];else state.fav[current.id]=true;save();document.getElementById('favBtn').textContent=state.fav[current.id]?'★ お気に入り解除':'☆ お気に入り'}
function resetProgress(){if(confirm('成績・間違い・お気に入りをすべて消します。よろしい？')){state={done:{},wrong:{},fav:{}};save()}}
updateStats();
</script></body></html>
